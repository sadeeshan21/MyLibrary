<!DOCTYPE html>
<html>
<head><title>Manage Books</title></head>
<body>
    <h1>Manage Books</h1>
    <a href="{{ url_for('librarian_bp.add_book_route') }}">Add New Book</a>
    <ul>
    {% for book in books %}
        <li>
            {{ book.title }} by {{ book.author }} — {{ book.category.category_name }} ({{ book.total_copies }} copies)
            <a href="{{ url_for('librarian_bp.edit_book_route', book_id=book.book_id) }}">Edit</a>
        </li>
    {% endfor %}
    </ul>
    <a href="{{ url_for('librarian_bp.dashboard') }}">Back to Dashboard</a>
</body>
</html>
